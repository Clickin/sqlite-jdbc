name: Attribute virtual-thread JDBC overhead

on:
  push:
    branches:
      - 'benchmarks/vt-cost/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out current fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check out pinned native-only upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xerial/sqlite-jdbc
          ref: cab7981c19ce04d691f0675f0b2586afc2bbf803
          path: target/ci/upstream
          persist-credentials: false
      - name: Install identical JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25.0.2'
          java-package: jdk
      - name: Install native build tools and allow CPU sampling
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-13 g++-13 binutils make tcl-dev unzip zip curl perl maven
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0
      - name: Build common engine and unchanged application
        run: bash scripts/benchmark/build-ci.sh
      - name: Download pinned profiler and build measurement-only JNI copies
        run: |
          mkdir -p target/ci/async-profiler
          curl --fail --location --retry 3 https://github.com/async-profiler/async-profiler/releases/download/v4.5/async-profiler-4.5-linux-x64.tar.gz -o target/ci/async-profiler.tar.gz
          echo '89546fbb9ee0fc5496c7edd4099b0709489bc78b0d8057ccbb4b801f6b032b62  target/ci/async-profiler.tar.gz' | sha256sum --check
          tar -xzf target/ci/async-profiler.tar.gz --strip-components=1 -C target/ci/async-profiler
          curl --fail --location --retry 3 https://github.com/async-profiler/async-profiler/releases/download/v4.5/async-profiler.jar -o target/ci/async-profiler.jar
          echo '81d6cae9971d41af140b1c627f40d511182e004b491307dc3c7de3b199ebcbbb  target/ci/async-profiler.jar' | sha256sum --check
          sysctl kernel.perf_event_paranoid kernel.kptr_restrict > target/vt-wait-evidence/ci-benchmark/profiler-permissions.log
          python3 scripts/benchmark/build-cost-probes.py
      - name: Smoke all native probe modes and CPU backend before long runs
        run: |
          python3 scripts/benchmark/run-cost-profile.py \
            --output target/vt-wait-evidence/ci-cost-smoke \
            --profiler-home target/ci/async-profiler \
            --profiler-jar target/ci/async-profiler.jar \
            --repetitions 1 --seconds 4 --warmup-requests 121 \
            2>&1 | tee target/vt-wait-evidence/ci-benchmark/cost-smoke.log
      - name: Run sequential stock, sampler and native-probe controls
        run: |
          python3 scripts/benchmark/run-cost-profile.py \
            --profiler-home target/ci/async-profiler \
            --profiler-jar target/ci/async-profiler.jar \
            --repetitions 3 --seconds 30 --warmup-requests 6000 \
            2>&1 | tee target/vt-wait-evidence/ci-benchmark/cost-profile.log
      - name: Summarize profiling completeness and overhead controls
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path('target/vt-wait-evidence/ci-cost-profile')
          path = root / 'summary.json'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('## JDBC cost attribution\n\nSame JDK/GCC/shared SQLite object. Normal load only. '
                           '6,000 warmup requests; 30 seconds; three repetitions; stock/async/probe-off/counts/sampled. '
                           'Instrumented timing is inclusive and includes probe overhead, not production throughput.\n\n')
              if not path.exists():
                  report.write('Incomplete profile; inspect evidence.\n')
                  raise SystemExit('Missing complete profiling summary')
              rows = json.loads(path.read_text())
              if len(rows) != 10 or any(row['runs'] != 3 for row in rows):
                  raise SystemExit('Incomplete profiling cells')
              report.write('| Mode | Driver | Median req/s | CPU ms/success | Failed runs |\n|---|---|---:|---:|---:|\n')
              for row in rows:
                  report.write(f"| {row['mode']} | {row['driver']} | {row['median_rps']:.2f} | "
                               f"{row['median_cpu_ms_per_success']:.3f} | {row['failed_runs']} |\n")
          PY
      - name: Upload all attribution evidence without databases
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jdbc-cost-profile-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            target/vt-wait-evidence/ci-benchmark/*.log
            target/vt-wait-evidence/ci-benchmark/*.json
            target/vt-wait-evidence/ci-benchmark/*.sha256
            target/vt-wait-evidence/ci-cost-profile/**
            target/ci/cost-probes/**
            target/vt-wait-evidence/ci-cost-smoke/**
            !target/vt-wait-evidence/ci-cost-smoke/**/data/**
            !target/vt-wait-evidence/ci-cost-smoke/classes/**
            !target/vt-wait-evidence/ci-cost-profile/**/data/**
            !target/vt-wait-evidence/ci-cost-profile/classes/**
