name: Compare isolated JDBC lock strategies

on:
  push:
    branches:
      - 'benchmarks/vt-lock/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      LC_ALL: C.UTF-8
      TZ: UTC
    steps:
      - name: Check out experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out pinned upstream
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: xerial/sqlite-jdbc
          ref: cab7981c19ce04d691f0675f0b2586afc2bbf803
          path: target/ci/upstream
          persist-credentials: false
      - name: Install identical JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25.0.2'
          java-package: jdk
      - name: Install native build tools
        run: |
          mkdir -p target/vt-wait-evidence/lock-workflow
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-13 g++-13 binutils make tcl-dev unzip zip curl perl maven
      - name: Build drivers with one common SQLite engine, without Gateway
        run: bash scripts/benchmark/build-ci.sh --drivers-only
      # The flat/reentrant experiment variants are generated from a pinned source tree and
      # were retired after the monitor-inflation fix; compare upstream with the current fork.
      - name: Run correctness, fixed-work lock matrix and separate diagnostics
        run: |
          python3 scripts/benchmark/run-lock-comparison.py \
            --variants xerial fork \
            --operations 5000000 --warmup-operations 1000000 --repetitions 4 \
            2>&1 | tee target/vt-wait-evidence/lock-workflow/comparison.log
      - name: Publish measured fixed-work summary
        if: always()
        run: |
          if [[ -f target/vt-wait-evidence/ci-lock-comparison/summary.md ]]; then
            cat target/vt-wait-evidence/ci-lock-comparison/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Isolated JDBC measurement incomplete; inspect evidence.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload lock evidence separately from overload observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jdbc-isolated-lock-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          compression-level: 6
          path: |
            target/vt-wait-evidence/lock-workflow/**
            target/vt-wait-evidence/ci-benchmark/*.log
            target/vt-wait-evidence/ci-benchmark/*.json
            target/vt-wait-evidence/ci-benchmark/*.sha256
            target/vt-wait-evidence/ci-lock-comparison/**
            target/ci/lock-variants/**
            !target/vt-wait-evidence/ci-lock-comparison/**/data/**
